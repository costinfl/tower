name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest

    env:
      # ADR-009 resolves application data to ~/.tower, overridable for CI so the
      # build never depends on, or writes to, the runner's home directory.
      #
      # This deliberately points OUTSIDE the workspace. Anywhere under it would
      # be one app-booting integration test away from writing a database file
      # into the checkout and failing the working-tree assertion below — which
      # is the very thing ADR-009 keeps application data out of.
      #
      # A literal path, not ${{ runner.temp }}: the runner context is only
      # available inside steps, and referencing it here makes the whole workflow
      # fail validation before a single job is scheduled.
      TOWER_HOME: /tmp/tower-ci-home

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The frontend is built by frontend-maven-plugin inside the Maven
      # reactor, so a single `mvn verify` covers backend and Viewer alike.
      #
      # Only npm's own download cache is cached, and deliberately so. Caching
      # the installed toolchain is what broke this build once already: with a
      # loose restore-key, a Node version bump missed the exact key, restored an
      # installation from before the bump, and left the plugin upgrading Node in
      # place - which produces a node and an npm that do not match. Every run
      # after the bump failed on a cache entry rather than on the commit.
      #
      # node_modules was cached alongside it and never earned anything: `npm ci`
      # deletes node_modules before installing, by definition. ~/.npm is the
      # directory that actually saves the downloads, it is content-addressed, and
      # a partial restore can only mean fewer packages fetched - never a
      # mismatched toolchain. Node itself is a sub-second download.
      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('tower-web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build, test and verify architecture
        run: mvn -B --no-transfer-progress verify

      # The two verification scripts, which check things no unit test can.
      #
      # Both have caught real defects that the test suite passed straight over:
      # an endpoint answering 500 where it owed 405, a demo renderer that had
      # silently drifted from the real one, a document assertion that was green
      # against data never created. Until now they ran only when somebody
      # remembered to run them, which is the same as not having them.
      #
      # A fresh store per run, in its own directory: acceptance.sh creates
      # fixtures under fixed names and refuses to run against a store that
      # already holds them.
      - name: Start Tower on an empty store
        env:
          TOWER_HOME: /tmp/tower-ci-acceptance
        run: |
          rm -rf "$TOWER_HOME"
          # Exactly one jar, named rather than globbed into java's argv: the
          # module also produces a .jar.original, and a glob that quietly
          # matched two would hand the second to the application as an argument.
          jar=$(ls tower-api/target/tower-api-*.jar | head -1)
          echo "Starting $jar"
          nohup java -jar "$jar" > /tmp/tower-ci.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/health > /dev/null && break
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8080/api/health > /dev/null; then
            echo "::error::Tower did not start."
            tail -50 /tmp/tower-ci.log
            exit 1
          fi

      - name: Acceptance pass — the documented Scenarios
        run: scripts/acceptance.sh

      # The Node the build itself downloaded, not the runner's: the script
      # bundles the demo backend with the esbuild that ships inside Vite, and
      # borrowing a different toolchain is how the Viewer build broke once
      # already.
      - name: Demo docgen parity — the demo renderer against the real one
        run: |
          export PATH="$PWD/tower-web/target/node:$PATH"
          scripts/verify-demo-docgen.sh

      - name: Tower log on failure
        if: failure()
        run: tail -200 /tmp/tower-ci.log || true

      - name: Stop Tower
        if: always()
        run: pkill -f 'tower-api-.*\.ja[r]' || true

      # ADR-009 keeps application data outside the working tree. If a build ever
      # writes a database file or a config file into the repository, that is a
      # defect and the build should say so rather than let it reach a commit.
      # Deliberately after the scripts above, so it covers what they write too.
      - name: Assert the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build wrote files into the working tree:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree is clean."

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/**"
          retention-days: 7
