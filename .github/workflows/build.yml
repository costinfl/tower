name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest

    env:
      # ADR-009 resolves application data to ~/.tower, overridable for CI so the
      # build never depends on, or writes to, the runner's home directory.
      #
      # This deliberately points OUTSIDE the workspace. Anywhere under it would
      # be one app-booting integration test away from writing a database file
      # into the checkout and failing the working-tree assertion below — which
      # is the very thing ADR-009 keeps application data out of.
      #
      # A literal path, not ${{ runner.temp }}: the runner context is only
      # available inside steps, and referencing it here makes the whole workflow
      # fail validation before a single job is scheduled.
      TOWER_HOME: /tmp/tower-ci-home

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The frontend is built by frontend-maven-plugin inside the Maven
      # reactor, so a single `mvn verify` covers backend and Viewer alike.
      #
      # Only npm's own download cache is cached, and deliberately so. Caching
      # the installed toolchain is what broke this build once already: with a
      # loose restore-key, a Node version bump missed the exact key, restored an
      # installation from before the bump, and left the plugin upgrading Node in
      # place - which produces a node and an npm that do not match. Every run
      # after the bump failed on a cache entry rather than on the commit.
      #
      # node_modules was cached alongside it and never earned anything: `npm ci`
      # deletes node_modules before installing, by definition. ~/.npm is the
      # directory that actually saves the downloads, it is content-addressed, and
      # a partial restore can only mean fewer packages fetched - never a
      # mismatched toolchain. Node itself is a sub-second download.
      - name: Cache the npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('tower-web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Build, test and verify architecture
        run: mvn -B --no-transfer-progress verify

      # ADR-009 keeps application data outside the working tree. If a build ever
      # writes a database file or a config file into the repository, that is a
      # defect and the build should say so rather than let it reach a commit.
      - name: Assert the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build wrote files into the working tree:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree is clean."

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/**"
          retention-days: 7
